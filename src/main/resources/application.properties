# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/loginms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration - Base64 encoded 256-bit secret key
app.jwt.secret=bXlTdXBlclNlY3JldEtleTEyMzQ1Njc4OTBBQkNERUZHSElKS0xNTk9QUVJTVFVWV1hZWg==
app.jwt.expiration=86400000

# Server Configuration
server.port=8081

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.loginms=DEBUG
